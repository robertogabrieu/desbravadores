# Site do app no Nginx do servidor (fora do Docker), ao lado dos outros sites da VPS.
#
# Instalado por `scripts/instalar.sh --nginx <dominio>`, que troca __DOMINIO__ e __PORTA__, copia para
# /etc/nginx/sites-available/ e roda `certbot --nginx`. Escuta so na porta 80 de proposito: o certbot
# encontra este bloco pelo server_name, acrescenta o `listen 443 ssl` e o redirecionamento de HTTP.
# Cabecalhos de seguranca (CSP e afins) ficam no nginx do container, nao aqui.

# Sem a query string: os links de foto e de material levam a assinatura nela.
log_format desbravadores_sem_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                   '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    access_log /var/log/nginx/desbravadores/access.log desbravadores_sem_query;
    # O log de erro repete a linha do pedido com a query: arquivo proprio, com a mesma rotacao.
    error_log /var/log/nginx/desbravadores/error.log;

    # Materiais de apoio chegam com ate 20 MB (o nginx do container limita cada rota).
    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:__PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A API confia em dois saltos (TRUST_PROXY=2): este nginx e o do container.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

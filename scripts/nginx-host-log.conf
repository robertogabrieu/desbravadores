# Formato de log do app no Nginx do servidor, instalado em /etc/nginx/conf.d/ por scripts/instalar.sh.
# Sem a query string: os links de foto e de material levam a assinatura nela.
log_format desbravadores_sem_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                                   '$status $body_bytes_sent $request_time "$http_user_agent"';

<title>Biblioteca Física</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: seletor de telas no topo; cada tela é um quadro do tamanho real (1280 ou 390 px), com rolagem própria. Tokens copiados de docs/fases/biblioteca/modelo (só estrutura e cores, nunca CSS do app). */
:root{
  --fundo:#F4F1EA; --papel:#fff; --tinta:#1B221F; --tinta2:#5B645F; --marca:#1F4D3A; --marca-esc:#163828; --marca-suave:#E3F0E8;
  --borda:#8A8375; --borda2:#D9D3C5; --perigo:#B42318; --perigo-suave:#FCE8E6; --aviso:#7A4B00; --aviso-suave:#FBEFD5; --menu:#CFE0D6;
  --titulo:'Bricolage Grotesque',system-ui,sans-serif; --corpo:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--corpo);font-size:16px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.t{font-family:var(--titulo)}
.topo{max-width:1280px;margin:0 auto 16px;display:flex;flex-direction:column;gap:12px}
.topo h1{font-family:var(--titulo);font-size:26px;font-weight:800;margin:0;text-wrap:balance}
.topo p{margin:0;color:var(--tinta2);max-width:62rem}
.seletor{display:flex;flex-wrap:wrap;gap:8px}
.seletor button{font:600 15px var(--corpo);min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--borda);background:var(--papel);color:var(--tinta);cursor:pointer}
.seletor button[aria-selected=true]{background:var(--marca);color:#fff;border-color:var(--marca)}
.seletor button:focus-visible,.btn:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.nota{max-width:1280px;margin:0 auto 12px;font-size:14px;color:var(--tinta2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.etiqueta{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff}
.nova{background:var(--marca)}.alt{background:#9A3412}
.moldura{max-width:1280px;margin:0 auto;overflow-x:auto;border:1px solid var(--borda2);border-radius:12px}
.quadro{position:relative;background:var(--fundo)}
.d{width:1280px;display:flex;min-height:760px}
.c{width:390px;display:flex;flex-direction:column;min-height:820px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font:600 16px var(--corpo);border:0;white-space:nowrap;cursor:default;text-decoration:none}
.pri{background:var(--marca);color:#fff}.sec{background:#fff;color:var(--tinta);border:1px solid var(--borda)}.out{background:#fff;color:var(--marca);border:1px solid var(--marca)}.txt{background:transparent;color:var(--tinta);padding:0 12px}.per{background:var(--perigo);color:#fff}
.off{background:#E8E3D7;color:#5B645F;border:1px solid var(--borda2)}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:16px}
aside{width:248px;flex-shrink:0;background:var(--marca);color:#fff}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--menu);font-weight:600}
.nav.on{background:var(--marca-esc);color:#fff}
.h2{font-family:var(--titulo);font-size:18px;font-weight:700;margin:0}
.conta{font-size:14px;color:var(--tinta2)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--borda2)}
.aba{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font-weight:600;color:var(--tinta2);border-bottom:3px solid transparent;margin-bottom:-1px}
.aba.on{color:var(--marca);border-color:var(--marca)}
.seg{display:flex;background:#E8E3D7;border-radius:12px;padding:4px}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:9px;font-weight:600;color:var(--tinta2)}
.seg span.on{background:#fff;color:var(--marca);box-shadow:0 1px 3px rgba(27,34,31,.2)}
.capa{container-type:inline-size;position:relative;aspect-ratio:3/4;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.capa small{font-size:9px;font-weight:700;letter-spacing:.08em;opacity:.9}
.capa i{position:absolute;right:-18%;bottom:-8%;width:80%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14)}
.capa b{position:relative;font-family:var(--titulo);font-size:min(22px,12cqw);font-weight:800;line-height:1}
.nome{font-size:16px;font-weight:700;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:14px;color:var(--tinta2);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pilula{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.ok{background:var(--marca-suave);color:var(--marca)}.tudo{background:var(--aviso-suave);color:var(--aviso)}.atr{background:var(--perigo-suave);color:var(--perigo)}.hoje{background:var(--aviso-suave);color:var(--aviso)}.dev{background:#E8E3D7;color:var(--tinta2)}
.grade{margin:0;padding:0;list-style:none;display:grid;gap:16px}
.card{padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:14px;font-weight:600}.ajuda{font-size:14px;color:var(--tinta2);margin:0}
.campo{display:flex;flex-direction:column;gap:6px}
.in{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--borda);border-radius:9px;background:#fff;padding:0 14px}
.fundo{position:absolute;inset:0;background:rgba(27,34,31,.4);z-index:10}
.dialogo{position:absolute;z-index:11;background:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 40px rgba(27,34,31,.25)}
.dialogo h2{font-family:var(--titulo);font-size:20px;font-weight:700;margin:0}
.lista{border:1px solid var(--borda);border-radius:9px;overflow:hidden}
.lista div{display:flex;flex-direction:column;padding:10px 14px;min-height:52px;justify-content:center}
.lista div+div{border-top:1px solid var(--borda2)}
.lista .sel{background:var(--marca-suave)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta2);padding:10px 14px;border-bottom:1px solid var(--borda2)}
td{padding:12px 14px;border-bottom:1px solid var(--borda2);vertical-align:middle}
tr.late td{background:#FFF7F6}
.tabnum{font-variant-numeric:tabular-nums}
.chip{display:flex;flex-direction:column;gap:2px;padding:14px 18px;min-width:170px}
.chip b{font-family:var(--titulo);font-size:28px;line-height:1}
.passo{max-width:1280px;margin:16px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.passo div{padding:14px 16px;font-size:15px;min-width:0}
.passo b{display:block;margin-bottom:4px}
</style>

<div class="topo">

  <p>Mockup da spec <code>docs/fases/biblioteca-fisica/SPEC.md</code> (rascunho 3). Parte da Biblioteca que já existe, com o mesmo menu, cartões e botões. Capas, nomes e datas são fictícios; hoje é 21/10/2026.</p>
  <div class="seletor" role="tablist" id="seletor"></div>
</div>
<div class="nota" id="nota"></div>
<div class="moldura"><div class="quadro" id="quadro"></div></div>

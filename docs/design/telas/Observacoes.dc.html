<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Observações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5DB}a{color:#1F4D3A}a:hover{color:#163828}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #1B221F; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px">
<a href="Inicio-Instrutor.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B221F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 17px">Observações</span><span style="font-size: 13px; color: #5B645F">Visíveis só para instrutores e Adm</span></div>
</header>
<div style="flex-shrink: 0; padding: 0 20px 12px">
<div role="tablist" aria-label="Agrupar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E8E3D7; padding: 4px; border-radius: 12px">
<button type="button" role="tab" aria-selected="{{isAula}}" onClick="{{pickAula}}" style="{{tabAula}}">Por aula</button>
<button type="button" role="tab" aria-selected="{{isDbv}}" onClick="{{pickDbv}}" style="{{tabDbv}}">Por DBV</button>
</div>
</div>
<main style="flex-grow: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{notas}}" as="n" hint-placeholder-count="5">
<article style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="{{n.tagStyle}}">{{n.tag}}</span>
<span style="font-size: 12px; color: #5B645F">{{n.quando}}</span>
</div>
<span style="font-weight: 700; font-size: 15px">{{n.titulo}}</span>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #3A423E">{{n.texto}}</p>
</article>
</sc-for>
</main>
<form style="flex-shrink: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4DFD3; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px">
<label style="height: 34px; padding: 0 12px; border-radius: 17px; background: #1B221F; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center"><input type="radio" name="alvo" checked="checked" style="position: absolute; opacity: 0; width: 0; height: 0">Aula de hoje</label>
<label style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #D9D3C5; font-size: 13px; font-weight: 700; display: flex; align-items: center"><input type="radio" name="alvo" style="position: absolute; opacity: 0; width: 0; height: 0">Um DBV…</label>
</div>
<div style="display: flex; gap: 8px; align-items: flex-end">
<label for="nota" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Nova observação</label>
<textarea id="nota" rows="2" placeholder="Escreva uma observação…" style="flex-grow: 1; border: 1px solid #D9D3C5; border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 15px; resize: none; background: #F9F7F2; color: #1B221F"></textarea>
<button type="button" aria-label="Salvar observação" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; border: 0; background: #1F4D3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"></path></svg></button>
</div>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { v: 'aula' }; }
renderVals() {
var self = this, v = this.state.v;
var on = 'height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1F4D3A; font-family: inherit; font-weight: 700; font-size: 14px; box-shadow: 0 1px 3px rgba(27,34,31,0.12)';
var off = 'height: 40px; border: 0; border-radius: 9px; background: transparent; color: #4A524E; font-family: inherit; font-weight: 600; font-size: 14px';
var aula = 'font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #F9ECEB; color: #9F2A20';
var dbv = 'font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #E3EEE7; color: #1F4D3A';
var porAula = [
{ tag: 'Aula · 27 set', quando: 'hoje, 10h02', titulo: 'Descoberta espiritual', texto: 'Turma animada com o jogo de memorização. Retomar o 7º ao 10º mandamento na próxima aula.', tagStyle: aula },
{ tag: 'Aula · 20 set', quando: '20 set', titulo: 'Gerais: Voto e Lei', texto: 'Faltou material de desenho; pedir à secretaria lápis de cor para o próximo encontro.', tagStyle: aula },
{ tag: 'Aula · 13 set', quando: '13 set', titulo: 'Saúde e aptidão física', texto: 'Convidar a enfermeira da igreja para a aula prática de primeiros socorros.', tagStyle: aula }
];
var porDbv = [
{ tag: 'Miguel Teixeira', quando: 'hoje', titulo: 'Precisa de reforço', texto: 'Chegou há pouco no clube; combinar revisão dos requisitos de Amigo em paralelo.', tagStyle: dbv },
{ tag: 'Isabela Martins', quando: '20 set', titulo: 'Voto ilustrado entregue', texto: 'Trabalho caprichado; sugerir para exposição no culto JA.', tagStyle: dbv },
{ tag: 'Gabriel Nunes', quando: '13 set', titulo: 'Faltas seguidas', texto: 'Conversar com o conselheiro Thiago e com a família sobre a frequência.', tagStyle: dbv }
];
return { notas: v === 'aula' ? porAula : porDbv, isAula: v === 'aula', isDbv: v === 'dbv', tabAula: v === 'aula' ? on : off, tabDbv: v === 'dbv' ? on : off,
pickAula: function () { self.setState({ v: 'aula' }); }, pickDbv: function () { self.setState({ v: 'dbv' }); } };
}
}
</script>
</body>
</html>

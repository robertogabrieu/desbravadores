<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Registro de reunião</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5DB}a{color:#1F4D3A}a:hover{color:#163828}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #1B221F; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px">
<a href="Inicio-Conselheiro.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B221F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 17px">Registro de reunião</span>
<span style="font-size: 13px; color: #5B645F">Dom, 27 set · Unidade Águias</span>
</div>
</header>
<div style="flex-shrink: 0; padding: 6px 20px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">{{presentes}}</span><span style="font-size: 12px; color: #5B645F; font-weight: 600">presentes</span></div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">{{atrasos}}</span><span style="font-size: 12px; color: #5B645F; font-weight: 600">atrasos</span></div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">{{uniformes}}</span><span style="font-size: 12px; color: #5B645F; font-weight: 600">uniforme ok</span></div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B645F">Toque no nome para marcar presença. Depois marque atraso, uniforme e Bíblia.</p>
</div>
<main style="flex-grow: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{lista}}" as="d" hint-placeholder-count="8">
<div style="{{d.card}}">
<button type="button" aria-pressed="{{d.presente}}" onClick="{{d.togglePresenca}}" style="display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 0; font-family: inherit; color: #1B221F; text-align: left; min-height: 44px; width: 100%">
<span style="{{d.check}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{d.nome}}</span><span style="font-size: 12px; color: #5B645F">{{d.status}}</span></span>
<span style="font-weight: 800; font-size: 14px; color: #1F4D3A">{{d.pts}}</span>
</button>
<sc-if value="{{d.presente}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px">
<button type="button" aria-pressed="{{d.atraso}}" onClick="{{d.toggleAtraso}}" style="{{d.chipAtraso}}">Atrasou</button>
<button type="button" aria-pressed="{{d.uniforme}}" onClick="{{d.toggleUniforme}}" style="{{d.chipUniforme}}">Uniforme</button>
<button type="button" aria-pressed="{{d.biblia}}" onClick="{{d.toggleBiblia}}" style="{{d.chipBiblia}}">Bíblia</button>
</div>
</sc-if>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<label for="obs" style="font-size: 13px; font-weight: 700">Observações da reunião</label>
<textarea id="obs" rows="3" placeholder="Ex.: ensaio do grito de guerra, arrecadação para o campori…" style="border: 1px solid #D9D3C5; border-radius: 12px; padding: 10px 12px; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1B221F; resize: none"></textarea>
</div>
</main>
<div style="flex-shrink: 0; padding: 12px 20px 20px; background: #F4F1EA; border-top: 1px solid #E4DFD3">
<a href="Historico-Reunioes.dc.html" style="height: 54px; border-radius: 14px; background: #1F4D3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-decoration: none">Salvar chamada · {{totalPts}} pts</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
this.state = { l: [
{ n: 'Ana Clara Souza', p: true, a: false, u: true, b: true },
{ n: 'Pedro Henrique Lima', p: true, a: true, u: true, b: true },
{ n: 'Júlia Ramos', p: true, a: false, u: false, b: true },
{ n: 'Isabela Martins', p: true, a: false, u: true, b: false },
{ n: 'Lívia Fernandes', p: false, a: false, u: false, b: false },
{ n: 'Enzo Barros', p: true, a: false, u: true, b: true },
{ n: 'Gabriel Nunes', p: false, a: false, u: false, b: false },
{ n: 'Davi Carvalho', p: true, a: true, u: false, b: false }
] };
}
upd(i, k) {
var l = this.state.l.map(function (x, j) { if (j !== i) return x; var y = Object.assign({}, x); y[k] = !y[k]; if (k === 'p' && !y.p) { y.a = false; y.u = false; y.b = false; } return y; });
this.setState({ l: l });
}
renderVals() {
var self = this, tot = 0;
var chip = function (on) { return 'height: 40px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; ' + (on ? 'border: 1px solid #1F4D3A; background: #E3EEE7; color: #1F4D3A' : 'border: 1px solid #D9D3C5; background: #FFFFFF; color: #5B645F'); };
var chipAtraso = function (on) { return 'height: 40px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; ' + (on ? 'border: 1px solid #B45309; background: #FBEFE3; color: #9A3412' : 'border: 1px solid #D9D3C5; background: #FFFFFF; color: #5B645F'); };
var lista = this.state.l.map(function (x, i) {
var pts = x.p ? 10 + (x.a ? 0 : 5) + (x.u ? 5 : 0) + (x.b ? 3 : 0) : 0;
tot += pts;
var st = !x.p ? 'Ausente' : [x.a ? 'Atrasou' : 'Pontual', x.u ? 'uniforme completo' : 'sem uniforme'].join(' · ');
return { nome: x.n, presente: x.p, atraso: x.a, uniforme: x.u, biblia: x.b, status: st, pts: x.p ? '+' + pts : '0',
card: 'border-radius: 16px; padding: 10px 12px; ' + (x.p ? 'background: #FFFFFF; border: 1px solid #FFFFFF' : 'background: #EFEBE1; border: 1px dashed #CFC8B8'),
check: 'width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (x.p ? 'background: #1F4D3A; color: #FFFFFF' : 'background: #FFFFFF; color: transparent; border: 2px solid #CFC8B8; box-sizing: border-box'),
chipAtraso: chipAtraso(x.a), chipUniforme: chip(x.u), chipBiblia: chip(x.b),
togglePresenca: function () { self.upd(i, 'p'); }, toggleAtraso: function () { self.upd(i, 'a'); },
toggleUniforme: function () { self.upd(i, 'u'); }, toggleBiblia: function () { self.upd(i, 'b'); } };
});
var l = this.state.l;
return { lista: lista, totalPts: tot,
presentes: l.filter(function (x) { return x.p; }).length + '/' + l.length,
atrasos: l.filter(function (x) { return x.a; }).length,
uniformes: l.filter(function (x) { return x.u; }).length };
}
}
</script>
</body>
</html>

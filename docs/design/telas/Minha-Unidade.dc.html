<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Minha unidade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5DB}a{color:#1F4D3A}a:hover{color:#163828}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #1B221F; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<main style="flex-grow: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; gap: 14px">
<span style="width: 56px; height: 56px; border-radius: 16px; background: #1F4D3A; color: #F3E3C8; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9c4-1 6 0 8 3 2-3 4-4 8-3l4-1-3 4c-2 3-5 4-9 4s-7-1-9-4z"></path><path d="M12 12v8"></path></svg></span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">Unidade Águias</h1>
<span style="font-size: 14px; color: #5B645F">Masculina e feminina · 8 desbravadores</span>
</div>
</header>
<div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; color: #5B645F">Grito de guerra</span>
<span style="font-size: 14px; font-style: italic">[Grito de guerra da unidade]</span>
</div>
<label style="height: 48px; background: #FFFFFF; border: 1px solid #D9D3C5; border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B645F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar desbravador</span>
<input type="search" placeholder="Buscar desbravador" style="flex-grow: 1; border: 0; outline: none; font-family: inherit; font-size: 16px; background: transparent; color: #1B221F">
</label>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{dbvs}}" as="d" hint-placeholder-count="8">
<li>
<a href="Perfil-DBV.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1B221F">
<span style="{{d.avatar}}">{{d.ini}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">{{d.nome}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B645F"><span style="{{d.dot}}"></span>{{d.classe}} · {{d.idade}} anos</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="{{d.freqStyle}}">{{d.freq}}</span>
<span style="font-size: 11px; color: #5B645F">frequência</span>
</span>
</a>
</li>
</sc-for>
</ul>
</main>
<nav aria-label="Navegação principal" style="height: 76px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E4DFD3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px">
<a href="Inicio-Conselheiro.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B645F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"></path></svg>Início</a>
<a href="Minha-Unidade.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; text-decoration: none; color: #1F4D3A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 3 3 6"></path></svg>Unidade</a>
<a href="Historico-Reunioes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B645F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 13l2 2 4-4"></path></svg>Reuniões</a>
<a href="Ranking.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B645F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>Ranking</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var c = { Amigo: '#2F5FB3', Companheiro: '#B3362F', Pesquisador: '#2E7D4F', Pioneiro: '#5F6670' };
var d = [['Ana Clara Souza','AC','Companheiro',11,94],['Pedro Henrique Lima','PH','Pesquisador',12,91],['Júlia Ramos','JR','Pesquisador',12,88],['Isabela Martins','IM','Companheiro',11,81],['Lívia Fernandes','LF','Amigo',10,86],['Enzo Barros','EB','Pioneiro',13,79],['Gabriel Nunes','GN','Companheiro',11,62],['Davi Carvalho','DC','Amigo',10,58]];
return { dbvs: d.map(function (x) {
return { nome: x[0], ini: x[1], classe: x[2], idade: x[3], freq: x[4] + '%',
avatar: 'width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; background: ' + c[x[2]] + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px',
dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + c[x[2]],
freqStyle: 'font-weight: 800; font-size: 15px; color: ' + (x[4] < 70 ? '#B42318' : '#1B221F') };
}) };
}
}
</script>
</body>
</html>

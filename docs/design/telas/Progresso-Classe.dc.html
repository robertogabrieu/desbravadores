<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Progresso da classe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5DB}a{color:#1F4D3A}a:hover{color:#163828}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #1B221F; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px">
<a href="Minhas-Classes.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B221F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="flex-grow: 1; font-weight: 700; font-size: 17px">Progresso da classe</span>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="{{isComp}}" onClick="{{pickComp}}" style="{{chipComp}}">Companheiro</button>
<button type="button" aria-pressed="{{isAmigo}}" onClick="{{pickAmigo}}" style="{{chipAmigo}}">Amigo</button>
</div>
<section style="{{hero}}">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<span style="font-size: 13px; font-weight: 700; opacity: 0.85">Média da turma</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; line-height: 1">{{media}}</span>
<span style="font-size: 13px; opacity: 0.85">{{info}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; text-align: right">
<span>{{prontos}} prontos p/ investidura</span>
<span>{{risco}} abaixo de 40%</span>
</div>
</section>
<ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border-radius: 16px">
<sc-for list="{{dbvs}}" as="d" hint-placeholder-count="7">
<li>
<a href="Perfil-DBV.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #EFEBE1; text-decoration: none; color: #1B221F">
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-weight: 700; font-size: 15px">{{d.nome}}</span>
<span style="font-size: 12px; color: #5B645F">faltam {{d.faltam}}</span>
<span style="font-weight: 800; font-size: 15px; width: 44px; text-align: right">{{d.pct}}</span>
</div>
<div style="height: 8px; border-radius: 4px; background: #EFEBE1"><div style="{{d.bar}}"></div></div>
</a>
</li>
</sc-for>
</ul>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { c: 'comp' }; }
renderVals() {
var self = this, c = this.state.c;
var cor = c === 'comp' ? '#B3362F' : '#2F5FB3';
var total = c === 'comp' ? 50 : 44;
var chip = function (on) { return 'height: 40px; padding: 0 16px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 700; ' + (on ? 'border: 1px solid #1B221F; background: #1B221F; color: #FFFFFF' : 'border: 1px solid #D9D3C5; background: #FFFFFF; color: #1B221F'); };
var comp = [['Ana Clara Souza',34],['Sofia Lopes',31],['Isabela Martins',27],['Heitor Alves',24],['Miguel Teixeira',16],['Laura Dias',19],['Gabriel Nunes',17]];
var amigo = [['Lívia Fernandes',38],['Davi Carvalho',30],['Bernardo Reis',33],['Alice Moura',29],['Theo Castro',27],['Helena Prado',26],['Arthur Pinto',24],['Manuela Cruz',31],['Noah Campos',15]];
var src = (c === 'comp' ? comp : amigo).slice().sort(function (a, b) { return b[1] - a[1]; });
var sum = 0, prontos = 0, risco = 0;
var dbvs = src.map(function (x) {
var p = Math.round(x[1] / total * 100); sum += p; if (p >= 90) prontos++; if (p < 40) risco++;
return { nome: x[0], pct: p + '%', faltam: (total - x[1]) + ' req.', bar: 'height: 8px; border-radius: 4px; width: ' + p + '%; background: ' + (p < 40 ? '#C2410C' : cor) };
});
return { dbvs: dbvs, media: Math.round(sum / src.length) + '%', info: src.length + ' DBVs · ' + total + ' requisitos', prontos: prontos, risco: risco,
hero: 'border-radius: 20px; padding: 18px; display: flex; align-items: flex-end; gap: 12px; color: #FFFFFF; background: ' + cor,
isComp: c === 'comp', isAmigo: c === 'amigo', chipComp: chip(c === 'comp'), chipAmigo: chip(c === 'amigo'),
pickComp: function () { self.setState({ c: 'comp' }); }, pickAmigo: function () { self.setState({ c: 'amigo' }); } };
}
}
</script>
</body>
</html>

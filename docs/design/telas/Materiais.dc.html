<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Materiais de apoio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5DB}a{color:#1F4D3A}a:hover{color:#163828}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F1EA; color: #1B221F; font-family: Figtree, system-ui, sans-serif; overflow: hidden">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px">
<a href="Minhas-Classes.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B221F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 17px">Materiais de apoio</span><span style="font-size: 13px; color: #5B645F">Companheiro · 9 itens</span></div>
</header>
<main style="flex-grow: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 84px; border-radius: 16px; border: 2px dashed #B8C9BE; background: #EEF4F0; color: #1F4D3A; font-family: inherit; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>Enviar arquivo</button>
<button type="button" style="height: 84px; border-radius: 16px; border: 2px dashed #B8C9BE; background: #EEF4F0; color: #1F4D3A; font-family: inherit; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"></path><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"></path></svg>Adicionar link</button>
</div>
<sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #5B645F">{{g.titulo}}</h2>
<div style="background: #FFFFFF; border-radius: 16px">
<sc-for list="{{g.itens}}" as="i" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFEBE1">
<span style="{{i.badge}}">{{i.tipo}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 14px">{{i.nome}}</span><span style="font-size: 12px; color: #5B645F">{{i.meta}}</span></span>
<button type="button" aria-label="Mais opções" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5B645F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var cores = { PDF: ['#FBE4E1','#9F2A20'], PPT: ['#FBEFE3','#9A3412'], LINK: ['#E1E8F5','#284F95'], VÍDEO: ['#EDE4F6','#5B3391'] };
var mk = function (t, n, m) { return { tipo: t, nome: n, meta: m, badge: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: ' + cores[t][0] + '; color: ' + cores[t][1] }; };
return { grupos: [
{ titulo: 'Descoberta espiritual', itens: [mk('PDF','Os 10 Mandamentos – cartões','1,2 MB · 20 set'), mk('PPT','Parábolas de Jesus','4,8 MB · 22 set'), mk('VÍDEO','Dinâmica: memorizando a Lei','youtube.com · 22 set')] },
{ titulo: 'Gerais', itens: [mk('PDF','Cartão de Companheiro','380 KB · 01 set'), mk('LINK','Requisitos da classe','adventistas.org · 01 set')] },
{ titulo: 'Saúde e aptidão física', itens: [mk('PDF','Primeiros socorros – roteiro','2,1 MB · 15 set'), mk('LINK','Quiz de revisão','forms · 18 set')] }
] };
}
}
</script>
</body>
</html>

# Camada de TESTES da stack local por agente (scripts/agente-stack.sh testar), sobreposta a
# docker-compose.agente.yml. A suíte da API cria um banco por execução (teste_<pid>_<hex>), roda as
# migrations e a carga oficial nele e o apaga no fim; aqui o Postgres também é descartável e
# mora em memória (tmpfs), então cada rodada fica isolada das outras e da stack de QA.
#
# TZ de São Paulo porque os testes de data dependem do fuso do clube.

services:
  postgres:
    volumes: !override
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    # os bancos de teste moram na memória do container: o teto cobre todos
    mem_limit: 1g
    memswap_limit: 1g

  testes:
    image: desbravadores/agente:dev
    profiles: ["testes"]
    user: "${AGENTE_UID:-1000}:${AGENTE_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      TZ: America/Sao_Paulo
      NODE_ENV: test
      NODE_OPTIONS: "--max-old-space-size=1536"
      DATABASE_URL: postgresql://desbravador:desbravador@postgres:5432/desbravador
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@postgres:5432/postgres
      PORTA_API: "3001"
      APP_URL: http://localhost:5173
      JWT_SEGREDO: "4444444444444444444444444444444444444444444444444444444444444444"
      ARQUIVOS_SEGREDO: "5555555555555555555555555555555555555555555555555555555555555555"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"
      SMTP_HOST: localhost
      SMTP_PORTA: "1026"
      SMTP_USUARIO: ""
      SMTP_SENHA: ""
      SMTP_FROM: "App do Desbravador <nao-responda@desbravadores.local>"
      ARQUIVOS_DIR: /tmp/arquivos
      # a varredura periódica fica desligada nos testes, como no .env.teste do projeto
      TAREFAS_PERIODICAS: "0"
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
    tmpfs:
      - /tmp
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    labels:
      - "agente.tipo=efemero"

# Container do front: serve o build, encaminha /api para a API. HTTPS fica no nginx do host.

map $http_x_forwarded_proto $proto_da_origem {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# O link assinado de /api/arquivos/ leva a assinatura na query: o log grava so o caminho ($uri).
log_format sem_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log sem_query;

    # Foto do desbravador: a API recusa acima de 2 MB; 3 MB deixa folga para o corpo multipart.
    client_max_body_size 3m;

    root /usr/share/nginx/html;
    index index.html;

    # Reresolve `api` por nome: o front sobe mesmo que a API ainda esteja reiniciando.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # add_header dentro de location descarta os do server: cada bloco repete os de seguranca.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        set $api http://api:3001;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_da_origem;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # E por estes arquivos que a versao nova chega ao aparelho: nunca em cache. Se faltarem, 404 —
    # o fallback do SPA devolveria index.html com tipo errado e o navegador recusaria o service worker.
    location ~ ^/(sw\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Nomes com hash: podem ficar um ano no cache.
    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;
        # Sem `always`: um 404 nao pode ficar um ano no cache.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html e rotas do SPA. Arquivo que existe (icones, favicon) sai como esta.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }
}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Criar usuario e banco do app
        run: psql "postgresql://postgres:postgres@localhost:5442/postgres" -f docker/initdb/01-desbravador.sql
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm run teste
      - run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Criar usuario e banco do app
        run: psql "postgresql://postgres:postgres@localhost:5442/postgres" -f docker/initdb/01-desbravador.sql
      - run: npm ci
      - run: npm run lint
      - run: npm run tipos
      - run: npm run teste
      - run: npm run build

  # Cada push na main que passou na verificacao vai para o servidor. Passo a passo da configuracao
  # (usuario de deploy, rede privada, variaveis) na secao "Deploy automatico" do README.
  deploy:
    name: Deploy (producao)
    needs: [verificar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: deploy-producao
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # Conferir aqui custa segundos. Sem isto, uma variavel faltando ou com o caminho de exemplo so
      # aparece depois de entrar na rede e abrir a sessao, no fim do log, como "No such file or directory".
      - name: Conferir a configuracao
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          faltando=""
          for nome in DEPLOY_USER DEPLOY_HOST DEPLOY_PATH; do
            [ -n "${!nome}" ] || faltando="${faltando} ${nome}"
          done
          [ -n "${TS_ID}" ] && [ -n "${TS_SECRET}" ] || faltando="${faltando} TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET"
          if [ -n "${faltando}" ]; then
            echo "::error::falta configurar:${faltando} — o passo a passo esta no README, secao Deploy automatico"
            exit 1
          fi
          case "${DEPLOY_PATH}" in
            */caminho/*|*"<"*|*exemplo*)
              echo "::error::DEPLOY_PATH ainda esta com o caminho de exemplo (${DEPLOY_PATH}). Grave o de verdade: gh variable set DEPLOY_PATH --body \"/caminho/real\""
              exit 1
              ;;
          esac
          echo "configuracao completa; servidor ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Entrar na rede privada
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy-ci
          version: latest

      # O runner so enxerga o servidor por dentro da rede privada, e a sessao e autorizada pela
      # identidade dele ali — nao ha chave de SSH guardada aqui.
      #
      # O roteiro viaja com o deploy: o que roda e sempre a versao que esta subindo. Ele e gravado la e
      # so entao executado — alimentar o bash pela entrada padrao nao funciona, porque o primeiro
      # `docker compose exec` de dentro dele consome essa entrada e engole o resto do roteiro, que
      # termina no meio anunciando sucesso. O nome leva o app porque o usuario de deploy pode servir a
      # outros apps no mesmo servidor.
      - name: Enviar o roteiro ao servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > ~/deploy-ci-desbravadores.sh" < scripts/deploy-ci.sh

      - name: Atualizar o servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -n -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash ~/deploy-ci-desbravadores.sh '${GITHUB_SHA}'"

      # O codigo de saida do roteiro nao basta como prova: um roteiro interrompido no meio tambem sai
      # com zero. Quem decide se o deploy aconteceu e o servidor, dizendo em que versao ele ficou.
      - name: Conferir a versao que ficou no servidor
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          no_servidor="$(ssh -n -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat '${DEPLOY_PATH}/.deployed-commit' 2>/dev/null || echo nenhuma")"
          echo "servidor: ${no_servidor}"
          echo "esperado: ${GITHUB_SHA}"
          if [ "${no_servidor}" != "${GITHUB_SHA}" ]; then
            echo "::error::o deploy nao chegou ao fim — o servidor nao esta na versao deste commit"
            exit 1
          fi
